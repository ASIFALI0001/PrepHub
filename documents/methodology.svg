  <circle cx="410" cy="555" r="5" fill="#fbbf24"/>
  <text x="424" y="559" font-size="11" fill="#fde68a">MongoDB Atlas cloud setup</text>
  <circle cx="410" cy="577" r="5" fill="#fbbf24"/>
  <text x="424" y="581" font-size="11" fill="#fde68a">Environment variables &amp; secrets</text>
